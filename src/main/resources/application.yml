spring:
  application:
    name: reglog-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reglog_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:reglog}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-use-32-plus-bytes-secret}
    issuer: ${JWT_ISSUER:reglog-backend}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
    cookie-name: ${JWT_COOKIE_NAME:access_token}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
    path: ${COOKIE_PATH:/}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@reglog.local}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.security: INFO
    com.reglog.backend: INFO
