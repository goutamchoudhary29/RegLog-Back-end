spring:
  datasource:
    url: jdbc:h2:file:./data/reglog_db;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  flyway:
    enabled: false

app:
  jwt:
    secret: this-is-a-very-secure-jwt-secret-key-with-more-than-32-bytes
    issuer: reglog-backend
    access-token-minutes: 30
    cookie-name: access_token
  cookie:
    secure: false
    same-site: Lax
    path: /
  cors:
    allowed-origin: http://localhost:5173
  mail:
    from: no-reply@reglog.local

server:
  port: 8080
